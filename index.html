<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noiserand</title>
</head>
<body>

    <h1>Analyzer</h1>
    <canvas id="analyzerCanvas" width="800" height="200" style="border:1px solid #000000;"></canvas>
    <h1>Master Controls</h1>
    <div id="master-control">
        <div>
            <label for="masterVolumeSlider">Master Volume</label>
            <input id="masterVolumeSlider" type="range" min="0" max="1" value="0.5" step="0.01" oninput="updateMasterVolume(this.value)">
            <span id="masterVolumeValue">0.50</span>
        </div>
        <div>
            <label for="stereoPanningSlider">Stereo Panning</label>
            <input id="stereoPanningSlider" type="range" min="-1" max="1" value="0" step="0.01" oninput="updateStereoPanning(this.value)">
            <span id="stereoPanningValue">0.00</span>
        </div>
        <div>
            <button id="startStopButton" onclick="toggleStartStop()">Start</button>
        </div>
    </div>

    <h1>Equalizer Controls</h1>
    <div id="param-eq-controls">
    </div>
    </div>

    <h1>Noise Controls</h1>
    <div id="noise-control">
        <div>
            <label for="noiseVolumeSlider">Noise Volume</label>
            <input id="noiseVolumeSlider" type="range" min="0" max="1" value="0.10" step="0.01" oninput="updateNoiseVolume(this.value)">
            <span id="noiseVolumeValue">0.10</span>
        </div>
        <div>
            <label for="noiseTypeSelect">Noise Type</label>
            <select id="noiseTypeSelect" onchange="updateNoiseType(this.value)">
                <option value="white">White</option>
                <option value="pink">Pink</option>
                <option value="brown">Brown</option>
            </select>
        </div>
    </div>

    <h1>Binaural Beats Controls</h1>
    <div id="bin-aural-beats-control">
        <div>
            <label for="binauralBeatsVolumeSlider">Volume</label>
            <input id="binauralBeatsVolumeSlider" type="range" min="0" max="1" value="0.5" step="0.01" oninput="updateBinauralBeatsVolume(this.value)">
            <span id="binauralBeatsVolumeValue">0.50</span>
        </div>
        <div>
            <label for="binauralBeatsCarrierFreqSlider">Carrier Frequency</label>
            <input id="binauralBeatsCarrierFreqSlider" type="range" min="10" max="400" value="200" step="1.0" oninput="updateBinauralBeatsCarrierFrequency(this.value)">
            <span id="binauralBeatsCarrierFreqValue">200</span>
        </div>
        <div>
            <label for="binauralBeatsBeatFreqSlider">Beat Frequency</label>
            <input id="binauralBeatsBeatFreqSlider" type="range" min="0.1" max="40" value="10" step="0.1" oninput="updateBinauralBeatsBeatFrequency(this.value)">
            <span id="binauralBeatsBeatFreqValue">10</span>
        </div>

    </div>

    <h1>Crackle Controls</h1>
    <div id="crackle-control">
        <div>
            <label for="crackleVolumeSlider">Crackle Volume</label>
            <input id="crackleVolumeSlider" type="range" min="0" max="1" value="1.0" step="0.01" oninput="updateCrackleVolume(this.value)">
            <span id="crackleVolumeValue">1.00</span>
        <div>
            <label for="crackleRateSlider">Crackle Rate</label>
            <input id="crackleRateSlider" type="range" min="0" max="50" value="5" step="0.1" oninput="updateCrackleRate(this.value)">
            <span id="crackleRateValue">5</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
